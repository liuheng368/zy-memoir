name: deploy-edgeone-preview

# 手动部署 EdgeOne Pages 测试环境。默认部署当前回忆散落分页测试分支，
# 不影响 main 生产环境。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy as EdgeOne preview'
        required: true
        default: 'codex-class-media-pagination'

concurrency:
  group: deploy-edgeone-preview-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGEONE_PROJECT_NAME: zy-memoir
      PNPM_STORE_PATH: .pnpm-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy EdgeOne preview
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone pages deploy -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN" -e preview
